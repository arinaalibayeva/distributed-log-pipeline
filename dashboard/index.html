<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Pipeline</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --leader: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --leader-bg: #eff4ff; --warn-bg: #fff7e6; --bad-bg: #fee2e2; --down-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318; --panel: #191e27; --text: #e6e9ef; --muted: #8b93a3; --line: #2a303c;
      --leader: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --leader-bg: #17233a; --warn-bg: #2e2612; --bad-bg: #3b1a1a; --down-bg: #15181f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  /* On a normal screen the page is exactly as tall as the window: the broker
     grid's rows share the space, and nothing scrolls. Small windows fall back
     to a page that scrolls (see the end of this style sheet). */
  .app { display: flex; flex-direction: column; gap: 20px; padding: 20px 24px; height: 100vh; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* Top bar */
  .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .top h1 { font-size: 22px; margin: 0; margin-right: auto; }
  .health { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .health::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .health.good { color: var(--ok); } .health.trouble { color: var(--warn); }
  .paused-banner { background: var(--warn-bg); color: var(--warn); font-weight: 600;
                   padding: 8px 14px; border-radius: 8px; }
  .feedback { min-height: 1.4em; font-size: 14px; }
  .feedback.ok { color: var(--ok); } .feedback.failed { color: var(--bad); }

  /* Buttons */
  button { font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 7px;
           border: 1px solid currentColor; background: transparent; color: var(--text); cursor: pointer; }
  button.kill { color: var(--bad); } button.restart { color: var(--ok); } button.cut { color: var(--warn); }
  button.small { font-size: 13px; padding: 4px 10px; }
  button:hover:not(:disabled) { background: var(--bg); }
  button:disabled { color: var(--muted); opacity: 0.45; cursor: default; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }

  /* The cluster grid on the left, the producers on the right */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr);
            gap: 20px; flex: 1; min-height: 0; }
  .cluster-panel { display: flex; flex-direction: column; min-height: 0; }

  /* Cluster grid */
  .cluster { display: grid; grid-template-columns: 130px repeat(3, minmax(0, 1fr));
             grid-template-rows: auto repeat(3, minmax(0, 1fr)); gap: 10px; flex: 1; min-height: 0; }
  .contents { display: contents; }
  .head { display: flex; flex-direction: column; gap: 8px; }
  .head .title { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 700; }
  .pill { font-size: 13px; font-weight: 700; }
  .pill.up { color: var(--ok); } .pill.cutoff, .pill.unreachable { color: var(--warn); } .pill.down { color: var(--bad); }
  .leads { font-size: 13px; color: var(--muted); min-height: 1.3em; }
  .leads b { color: var(--leader); }
  .rowname { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .rowname .name { font-size: 17px; font-weight: 700; }
  .rowname .note { font-size: 13px; color: var(--muted); }
  .rowname.noleader { background: var(--bad-bg); }
  .rowname.noleader .note { color: var(--bad); font-weight: 600; }
  .newleader { color: var(--leader); font-weight: 700; }
  .cell { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 6px; transition: box-shadow 0.3s; }
  .cell .role { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .cell .state { font-size: 18px; font-weight: 700; }
  .cell .detail { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cell.leader { border: 2px solid var(--leader); background: var(--leader-bg); }
  .cell.leader .role, .cell.leader .state { color: var(--leader); }
  .cell.flash { box-shadow: 0 0 0 5px color-mix(in srgb, var(--leader) 35%, transparent); }
  .cell.synced .state { color: var(--ok); }
  .cell.behind { background: var(--warn-bg); }
  .cell.behind .state { color: var(--warn); }
  .cell.isdown { background: var(--down-bg); color: var(--muted); justify-content: center; align-items: center; }
  .cell.isdown .state { color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; background: var(--warn); }
  .lines { font: 13px/1.5 ui-monospace, Menlo, monospace; display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
  .lines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lines .offset { color: var(--muted); }
  .uncommitted { opacity: 0.45; }
  .ERROR { color: var(--bad); font-weight: 600; } .WARN { color: var(--warn); }

  /* Producers */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .producer { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
              padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .producer:last-child { border-bottom: none; padding-bottom: 0; }
  .producer .name { font-weight: 700; }
  .producer .stats { font-size: 14px; }
  .waiting { color: var(--warn); font-weight: 700; }

  /* Right column: producers, and below them the timeline, which gets the
     rest of the column and scrolls on its own. */
  .side { display: flex; flex-direction: column; gap: 20px; min-width: 0; min-height: 0; }
  .side .timeline { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .feed { display: flex; flex-direction: column; gap: 6px; font-size: 14px; overflow-y: auto; flex: 1 1 0; min-height: 0; }
  .feed .item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
  .feed .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .kind-action { color: var(--muted); }
  .kind-down { color: var(--bad); }
  .kind-up, .kind-sync { color: var(--ok); }
  .kind-leader { color: var(--leader); font-weight: 600; }
  .seg { display: flex; }
  .seg button { border-color: var(--line); border-radius: 0; margin-left: -1px; padding: 6px 12px; }
  .seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 7px 7px 0; }
  .seg button.active, .seg button.active:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
  .network { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; font-size: 14px; }
  .network .label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .trouble { color: var(--warn); font-weight: 600; }

  @media (max-width: 1200px), (max-height: 760px) {
    .app { height: auto; min-height: 100vh; }
    .layout { flex: none; grid-template-rows: none; }
    .cluster { flex: none; grid-template-rows: none; }
    .cell { min-height: 150px; }
    .side .timeline, .feed { flex: none; }
  }
  @media (max-width: 1200px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 800px) {
    .app { padding: 16px; }
    .cluster { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .corner { display: none; }
    .rowname { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Distributed log pipeline</h1>
    <span class="health good" id="health">healthy</span>
    <span class="feedback" id="feedback"></span>
    <button id="pause">Pause view</button>
    <span class="muted" id="status">connecting…</span>
  </div>
  <div class="paused-banner" id="paused" hidden>View paused: the cluster keeps running. Press Resume to see the live state.</div>

  <section class="panel network">
    <span class="label">Network</span>
    <span>Lose messages between brokers:</span>
    <div class="seg" id="drop"></div>
    <button class="restart" id="heal">Heal network</button>
    <span class="muted" id="netstatus"></span>
  </section>

  <div class="layout">
    <section class="panel cluster-panel">
      <h2>Brokers and their copies of each partition</h2>
      <div class="cluster">
        <div class="corner"></div>
        <div class="contents" id="heads"></div>
        <div class="contents" id="rows"></div>
      </div>
    </section>
    <aside class="side">
      <section class="panel">
        <h2>Producers</h2>
        <div class="rows" id="producers"></div>
      </section>
      <section class="panel timeline">
        <h2>What happened</h2>
        <div class="feed" id="events"></div>
      </section>
    </aside>
  </div>
</div>
<script>
const heads = document.getElementById("heads");
const rows = document.getElementById("rows");
const statusText = document.getElementById("status");
const feedback = document.getElementById("feedback");
const TAIL = 4;
const DROP_RATES = [0, 0.1, 0.3, 0.5];
const FLASH_MS = 4000;
// Headers, producer rows and controls are built once and updated in place:
// rebuilding a button every second would drop clicks that land during a redraw.
const headers = {};
const producerRows = {};
const lastLeader = {};  // partition -> "broker:epoch" seen on the previous refresh
const flashUntil = {};  // partition -> time until which its new leader glows
let paused = false;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

const number = n => n.toLocaleString();
const clock = seconds => new Date(seconds * 1000).toLocaleTimeString([], { hour12: false });

// The leader is the broker that says it leads; if two do (an old leader that
// hasn't heard yet), the one with the newer epoch.
function leaderOf(name, brokers) {
  let best = null;
  for (const [id, state] of Object.entries(brokers)) {
    const copy = state && state.partitions[name];
    if (copy && copy.role === "leader" && (best === null || copy.epoch > best.copy.epoch)) best = { id, copy };
  }
  return best;
}

let feedbackTimer = null;
function tell(message, ok) {
  feedback.textContent = message;
  feedback.className = "feedback " + (ok ? "ok" : "failed");
  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => { feedback.textContent = ""; }, 5000);
}

// Send one control request, showing it as pending on `button`, then report
// how it went and refresh the view.
async function act(button, path, body, done) {
  const label = button.textContent;
  button.disabled = true;
  button.pending = true;
  button.textContent = label + "…";
  try {
    const response = await fetch(path, {
      method: "POST",
      headers: body ? { "content-type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const reply = await response.json().catch(() => ({}));
    if (!response.ok) {
      tell(`Failed: ${reply.detail || response.status}`, false);
    } else {
      const skipped = Object.entries(reply.brokers || {}).filter(([, settings]) => settings === null).map(([id]) => id);
      tell(done + (skipped.length ? ` (broker ${skipped.join(", ")} is down and was skipped)` : ""), true);
    }
  } catch (error) {
    tell("Failed: dashboard server not reachable", false);
  } finally {
    button.pending = false;
    button.disabled = false;  // the refresh below disables it again if it doesn't apply
    button.textContent = label;
    refresh(true);
  }
}

const dropButtons = DROP_RATES.map(rate => {
  const percent = `${Math.round(rate * 100)}%`;
  const button = el("button", "", percent);
  button.onclick = () => act(button, "/chaos/drop", { rate }, `Brokers now lose ${percent} of their messages`);
  document.getElementById("drop").append(button);
  return button;
});
const healButton = document.getElementById("heal");
healButton.onclick = () => act(healButton, "/chaos/heal", null, "Network healed");

const pauseButton = document.getElementById("pause");
pauseButton.onclick = () => {
  paused = !paused;
  pauseButton.textContent = paused ? "Resume" : "Pause view";
  document.getElementById("paused").hidden = !paused;
  if (!paused) refresh();
};

function setDisabled(button, disabled) {
  if (!button.pending) button.disabled = disabled;
}

// ----- Brokers and copies -----

function brokerHeader(id) {
  const head = el("div", "panel head");
  const title = el("div", "title");
  const pill = el("span", "pill");
  title.append(el("span", "", `Broker ${id}`), pill);
  const leads = el("div", "leads");
  const kill = el("button", "kill", "Kill");
  kill.onclick = () => act(kill, `/brokers/${id}/kill`, null, `Killed broker ${id}`);
  const restart = el("button", "restart", "Restart");
  restart.onclick = () => act(restart, `/brokers/${id}/restart`, null, `Restarted broker ${id}`);
  // One button that cuts the broker off, or reconnects it when it is cut off.
  const link = el("button", "cut", "Cut off");
  link.onclick = () => link.reconnects
    ? act(link, `/chaos/reconnect/${id}`, null, `Reconnected broker ${id}`)
    : act(link, `/chaos/cut-off/${id}`, null, `Cut off broker ${id}`);
  const buttons = el("div", "buttons");
  buttons.append(kill, restart, link);
  head.append(title, leads, buttons);
  heads.append(head);
  return { pill, leads, kill, restart, link };
}

function isCutOff(id, data) {
  return data.cut_off.includes(Number(id));
}

// up / cut off (answers the dashboard, but not other brokers) / unreachable
// (process running, not answering) / stopped (process dead) / down (unknown).
function brokerStatus(id, data) {
  if (data.brokers[id]) return isCutOff(id, data) ? "cut off" : "up";
  if (!data.processes) return "down";
  return data.processes[id] === "running" ? "unreachable" : "stopped";
}

const STATUS_CLASS = { "up": "up", "cut off": "cutoff", "unreachable": "unreachable", "stopped": "down", "down": "down" };

function updateHeader(id, data, leaders) {
  const header = headers[id] || (headers[id] = brokerHeader(id));
  const state = data.brokers[id];
  const status = brokerStatus(id, data);
  header.pill.className = "pill " + STATUS_CLASS[status];
  header.pill.textContent = status;

  const led = data.partitions.filter(name => leaders[name] && leaders[name].id === id);
  header.leads.replaceChildren(...(led.length
    ? ["leads ", ...led.flatMap((name, i) => [i ? ", " : "", el("b", "", name)])]
    : [state ? "leads nothing" : ""]));

  const running = data.processes ? data.processes[id] === "running" : !!state;
  header.kill.hidden = header.restart.hidden = !data.controls;
  setDisabled(header.kill, !running);
  setDisabled(header.restart, running);
  header.link.reconnects = isCutOff(id, data);
  if (!header.link.pending) header.link.textContent = header.link.reconnects ? "Reconnect" : "Cut off";
  header.link.className = header.link.reconnects ? "restart" : "cut";
  setDisabled(header.link, !state && !header.link.reconnects);
}

// Remember each partition's leader, and start the glow when it changes.
function noteLeaders(data, leaders) {
  const now = Date.now();
  for (const name of data.partitions) {
    const leader = leaders[name];
    const key = leader ? `${leader.id}:${leader.copy.epoch}` : null;
    if (key && lastLeader[name] !== undefined && key !== lastLeader[name]) flashUntil[name] = now + FLASH_MS;
    if (key) lastLeader[name] = key;
    else if (lastLeader[name] === undefined) lastLeader[name] = null;
  }
}

function linesOf(copy, count) {
  const lines = el("div", "lines");
  for (const entry of copy.last_entries.slice(-count)) {
    const line = el("div", entry.offset > copy.commit_index ? "uncommitted" : "");
    line.append(el("span", "offset", `${entry.offset} `), el("span", entry.line.level, entry.line.level), ` ${entry.line.text}`);
    line.title = line.textContent;
    lines.append(line);
  }
  return lines;
}

function copyCell(copy, status, leader, isLeader, flashing, inSync) {
  if (!copy) {
    const cell = el("div", "panel cell isdown");
    cell.append(el("div", "state", status));
    return cell;
  }
  const details = `${number(copy.length)} lines · ${number(copy.commit_index + 1)} committed · epoch ${copy.epoch}`;
  if (isLeader) {
    const cell = el("div", "panel cell leader" + (flashing ? " flash" : ""));
    cell.append(el("div", "role", "★ leader"), el("div", "state", "receiving lines"), el("div", "detail", details),
                linesOf(copy, TAIL));
    return cell;
  }
  const behind = leader ? leader.copy.length - copy.length : 0;
  const synced = leader && behind <= inSync;
  const cell = el("div", "panel cell " + (synced ? "synced" : leader ? "behind" : ""));
  cell.title = details;
  cell.append(el("div", "role", "follower"));
  if (!leader) {
    cell.append(el("div", "state", "waiting for a leader"));
  } else if (synced) {
    cell.append(el("div", "state", "✓ in sync"));
  } else {
    cell.append(el("div", "state", `⚠ ${number(behind)} lines behind`));
    const bar = el("div", "bar");
    const fill = el("div");
    fill.style.width = `${Math.max(2, Math.round(100 * copy.length / Math.max(1, leader.copy.length)))}%`;
    bar.append(fill);
    cell.append(bar);
  }
  cell.append(el("div", "detail", details));
  return cell;
}

function renderCluster(data, ids, leaders) {
  const now = Date.now();
  const cells = [];
  for (const name of data.partitions) {
    const leader = leaders[name];
    const flashing = (flashUntil[name] || 0) > now;
    const row = el("div", "panel rowname" + (leader ? "" : " noleader"));
    const note = el("span", "note", leader ? `leader: broker ${leader.id}` : "no leader");
    if (leader && flashing) note.append(" ", el("span", "newleader", "new"));
    row.append(el("span", "name", name), note);
    cells.push(row);
    for (const id of ids) {
      const state = data.brokers[id];
      cells.push(copyCell(state && state.partitions[name], brokerStatus(id, data), leader,
                          leader && leader.id === id, flashing, data.in_sync));
    }
  }
  rows.replaceChildren(...cells);
  // On a short screen a leader's cell can't fit all its lines: drop the
  // oldest ones rather than cutting a line in half.
  for (const lines of rows.querySelectorAll(".cell .lines")) {
    const cell = lines.parentElement;
    while (lines.children.length > 1 && cell.scrollHeight > cell.clientHeight) lines.firstElementChild.remove();
  }
}

// ----- Network -----

// Returns a list of current problems, for the network panel and the top bar.
function updateNetwork(data, ids) {
  const up = ids.filter(id => data.brokers[id]);
  const rate = Math.max(0, ...up.map(id => data.brokers[id].chaos.drop_rate));
  dropButtons.forEach((button, i) => button.classList.toggle("active", DROP_RATES[i] === rate));
  const trouble = [];
  if (rate) trouble.push(`losing ${Math.round(rate * 100)}% of messages`);
  if (data.cut_off.length) trouble.push(`broker ${data.cut_off.join(", ")} cut off`);
  const status = document.getElementById("netstatus");
  status.textContent = trouble.join(" · ");  // empty while every link works
  status.className = trouble.length ? "trouble" : "muted";
  return trouble;
}

// ----- Producers -----

function producerRow(service) {
  const row = el("div", "producer");
  const stats = el("div", "stats");
  const where = el("div", "muted");
  const info = el("div");
  info.append(stats, where);
  const toggle = el("button", "small", "Pause");
  toggle.onclick = () => toggle.resumes
    ? act(toggle, `/producers/${service}/resume`, null, `Resumed the ${service} producer`)
    : act(toggle, `/producers/${service}/pause`, null, `Paused the ${service} producer`);
  const buttons = el("div", "buttons");
  buttons.append(toggle);
  row.append(el("div", "name", service), info, buttons);
  document.getElementById("producers").append(row);
  return { stats, where, toggle };
}

function renderProducers(data) {
  for (const service of data.partitions) {
    const row = producerRows[service] || (producerRows[service] = producerRow(service));
    const status = data.producers[service];
    const running = status && !status.stale;
    if (!running) {
      row.stats.textContent = "not running";
      row.where.textContent = "";
    } else {
      row.stats.replaceChildren(el("div", "num", `${number(status.acked)} acked`),
        status.waiting > 0 ? el("div", "waiting num", `${number(status.waiting)} waiting to retry`)
                           : el("div", "muted", "nothing waiting"));
      row.where.textContent = status.paused ? "paused: not making new lines" : `sending to broker ${status.leader}`;
    }
    row.toggle.resumes = !!(status && status.paused);
    if (!row.toggle.pending) row.toggle.textContent = row.toggle.resumes ? "Resume" : "Pause";
    setDisabled(row.toggle, !running);
  }
}

// ----- Timeline -----

function renderEvents(data) {
  const items = data.events.map(event => {
    const item = el("div", "item");
    item.append(el("span", "when", clock(event.time)), el("span", `kind-${event.kind}`, event.text));
    return item;
  });
  const feed = document.getElementById("events");
  const scrolled = feed.scrollTop;  // keep the reader's place across refreshes
  feed.replaceChildren(...(items.length ? items : [el("div", "muted", "Nothing yet.")]));
  feed.scrollTop = scrolled;
}

// ----- Refresh -----

function render(data) {
  const ids = Object.keys(data.brokers);
  const leaders = Object.fromEntries(data.partitions.map(name => [name, leaderOf(name, data.brokers)]));
  noteLeaders(data, leaders);
  for (const id of ids) updateHeader(id, data, leaders);
  const trouble = updateNetwork(data, ids);

  const down = ids.filter(id => !data.brokers[id]);
  const leaderless = data.partitions.filter(name => !leaders[name]);
  if (down.length) trouble.unshift(`broker ${down.join(", ")} down`);
  if (leaderless.length) trouble.unshift(`${leaderless.join(", ")} without a leader`);
  const health = document.getElementById("health");
  health.textContent = trouble.length ? trouble.join(" · ") : "healthy";
  health.className = "health " + (trouble.length ? "trouble" : "good");

  renderCluster(data, ids, leaders);
  renderProducers(data);
  renderEvents(data);
}

// `force` redraws even while paused, so a button press shows its result.
async function refresh(force = false) {
  if (paused && !force) return;
  try {
    const response = await fetch("/cluster");
    render(await response.json());
    statusText.textContent = (paused ? "paused at " : "updated ") + new Date().toLocaleTimeString();
  } catch (error) {
    statusText.textContent = "dashboard server not reachable";
  }
}

refresh();
setInterval(refresh, 1000);
</script>
